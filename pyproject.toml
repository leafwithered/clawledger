[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clawledger"
version = "0.1.2"
description = "Tamper-evident ZeroClaw audit checkpoints anchored to Solana"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "leafwithered" }]
dependencies = []

[project.scripts]
clawledger = "clawledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clawledger = ["vendor/*.js", "vendor/*.txt"]
