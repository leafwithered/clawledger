name: submission-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile and test
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests scripts plugins
          python -m unittest discover -s tests -v

      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Reproduce checkpoint and verification
        run: |
          .venv/bin/clawledger checkpoint \
            --input fixtures/runtime-trace.sample.jsonl \
            --output checkpoint-ci.json
          .venv/bin/clawledger verify \
            --input fixtures/runtime-trace.sample.jsonl \
            --manifest checkpoint-ci.json

      - name: Check public Devnet transaction construction
        env:
          PYTHONPATH: src
        run: python scripts/live_action_smoke.py

      - name: Scan tracked files for secret-shaped values
        run: |
          if git grep -En '([0-9]{8,10}:[A-Za-z0-9_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk-[A-Za-z0-9]{32,})' -- .; then
            echo "Secret-shaped value detected in tracked files" >&2
            exit 1
          fi
