<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ClawLedger architecture</title>
  <desc id="desc">ZeroClaw private logs are hashed locally into a Merkle checkpoint, reviewed by a human wallet, and anchored as a root on Solana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10263a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14f195"/><stop offset="1" stop-color="#9945ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#65d8ff"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f5fbff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">ClawLedger</text>
  <text x="70" y="108" fill="#91a9ba" font-family="Segoe UI,Arial,sans-serif" font-size="18">A public timestamp for a private AI agent</text>
  <rect x="70" y="150" width="235" height="230" rx="22" fill="#122c42" stroke="#2c5270" filter="url(#shadow)"/>
  <text x="98" y="198" fill="#f5fbff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">ZeroClaw</text>
  <text x="98" y="234" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">runtime-trace.jsonl</text>
  <text x="98" y="270" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">• tool events</text>
  <text x="98" y="300" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">• approvals</text>
  <text x="98" y="330" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">• receipt evidence</text>
  <rect x="365" y="150" width="235" height="230" rx="22" fill="#122c42" stroke="#2c5270" filter="url(#shadow)"/>
  <text x="393" y="198" fill="#f5fbff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Local checkpoint</text>
  <text x="393" y="238" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Canonical JSON</text>
  <text x="393" y="270" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">SHA-256 leaves</text>
  <text x="393" y="302" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Merkle root + proofs</text>
  <rect x="393" y="330" width="176" height="8" rx="4" fill="url(#accent)"/>
  <rect x="660" y="150" width="205" height="230" rx="22" fill="#122c42" stroke="#2c5270" filter="url(#shadow)"/>
  <text x="688" y="198" fill="#f5fbff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Human wallet</text>
  <text x="688" y="240" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Reviews one Memo</text>
  <text x="688" y="272" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Signs explicitly</text>
  <text x="688" y="304" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Agent holds no key</text>
  <circle cx="762" cy="342" r="18" fill="none" stroke="#14f195" stroke-width="5"/>
  <path d="M756 342 l5 6 11 -14" fill="none" stroke="#14f195" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="925" y="150" width="205" height="230" rx="22" fill="#122c42" stroke="#2c5270" filter="url(#shadow)"/>
  <text x="953" y="198" fill="#f5fbff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Solana</text>
  <text x="953" y="240" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Memo program</text>
  <text x="953" y="272" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">root + count only</text>
  <text x="953" y="304" fill="#a7bdcb" font-family="Segoe UI,Arial,sans-serif" font-size="16">durable timestamp</text>
  <path d="M953 342 h148" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M305 265 H350" stroke="#65d8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 265 H645" stroke="#65d8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M865 265 H910" stroke="#65d8ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="70" y="444" fill="#14f195" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">ON-CHAIN</text>
  <text x="166" y="444" fill="#d4e2ea" font-family="Segoe UI,Arial,sans-serif" font-size="17">32-byte root + event count</text>
  <text x="508" y="444" fill="#9945ff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">STAYS LOCAL</text>
  <text x="625" y="444" fill="#d4e2ea" font-family="Segoe UI,Arial,sans-serif" font-size="17">prompts, results, IDs, timestamps, private keys</text>
</svg>
